name: zerotier-planet

services:
  planet:
    image: ${DOCKER_IMAGE:-xubiaolin/zerotier-planet:latest}
    build:
      context: .
      args:
        PROJECT_REVISION: ${PROJECT_REVISION:-local}
        ZEROTIER_VERSION: ${ZEROTIER_VERSION:-1.16.2}
        ZTNCUI_COMMIT: ${ZTNCUI_COMMIT:-1b2284864de48d2dcae22582fff122fe24909c3d}
    container_name: ${CONTAINER_NAME:-myztplanet}
    environment:
      API_PORT: ${API_PORT:-3443}
      FILE_SERVER_PORT: ${FILE_SERVER_PORT:-3000}
      IP_ADDR4: ${IP_ADDR4:-}
      IP_ADDR6: ${IP_ADDR6:-}
      ZTNCUI_ADMIN_PASSWORD: ${ZTNCUI_ADMIN_PASSWORD:-}
      ZT_PORT: ${ZT_PORT:-9994}
    ports:
      - ${ZT_PORT:-9994}:${ZT_PORT:-9994}/tcp
      - ${ZT_PORT:-9994}:${ZT_PORT:-9994}/udp
      - ${API_PORT:-3443}:${API_PORT:-3443}/tcp
      - ${FILE_SERVER_PORT:-3000}:${FILE_SERVER_PORT:-3000}/tcp
    volumes:
      - ${DATA_DIR:-./data/zerotier}/config:/app/config
      - ${DATA_DIR:-./data/zerotier}/dist:/app/dist
      - ${DATA_DIR:-./data/zerotier}/ztncui:/app/ztncui
      - ${DATA_DIR:-./data/zerotier}/one:/var/lib/zerotier-one
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
