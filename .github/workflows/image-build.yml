name: Verify and publish ZeroTier image

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Docker Hub (I confirm I have the upstream redistribution rights)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: image-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and test on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      CANDIDATE: zerotier-planet-ci:${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check runner and shell scripts
        run: |
          docker version
          docker buildx version
          test -c /dev/net/tun || sudo modprobe tun
          test -c /dev/net/tun
          for script in deploy.sh patch/*.sh scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
          sh -n patch/healthcheck.sh

      - name: Select ZeroTier version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            release=$(curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/zerotier/ZeroTierOne/releases/latest)
            version=$(jq -er '.tag_name' <<<"$release")
          else
            version=$(sed -n 's/^ARG TAG=//p' Dockerfile)
          fi
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "Testing ZeroTier $version on $RUNNER_NAME"

      - name: Build candidate image
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: docker buildx build --load --platform "linux/$ARCH" --build-arg "TAG=$VERSION" --tag "$CANDIDATE" .

      - name: Check license files in the candidate
        run: |
          docker run --rm --network none --entrypoint sh "$CANDIDATE" -ec '
            cd /usr/share/doc
            for path in zerotier/LICENSE.txt zerotier/LICENSE-MPL.txt zerotier/nonfree/LICENSE.md ztncui/LICENSE; do
              test -s "$path"
            done
          '

      - name: Test container initialization and signing
        run: tests/container-init.sh "$CANDIDATE"

      - name: Test upgrades and rollback across storage layouts
        run: |
          for layout in directory parent-link root-link mounts; do
            echo "::group::Upgrade tests ($layout)"
            TEST_UPGRADE_LAYOUT="$layout" tests/upgrade.sh
            echo "::endgroup::"
          done

      - name: Test legacy client reconnection after upgrade and rollback
        run: tests/deployment-e2e.sh "$CANDIDATE"

      - name: Save tested image
        if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir tested-image
          cd tested-image
          printf '%s\n' "$VERSION" > version
          docker save "$CANDIDATE" | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256

      - name: Upload tested image
        if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-image-${{ matrix.arch }}
          path: tested-image/
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish tested images to Docker Hub
    needs: image
    if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub-production
    env:
      REPOSITORY: xubiaolin/zerotier-planet
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tested-image-*

      - name: Verify downloaded image archives and platforms
        run: |
          version=$(cat tested-image-amd64/version)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for arch in amd64 arm64; do
            directory=tested-image-$arch
            [[ $(cat "$directory/version") == "$version" ]]
            (
              cd "$directory"
              sha256sum --check image.tar.gz.sha256
              docker load --input image.tar.gz
            )
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "zerotier-planet-ci:$arch")
            [[ $platform == "linux/$arch" ]]
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish both platforms and multi-platform tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/docker-login.XXXXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          manifests=()
          for arch in amd64 arm64; do
            tag="$REPOSITORY:$VERSION-$arch"
            docker tag "zerotier-planet-ci:$arch" "$tag"
            output=$(docker push "$tag")
            printf '%s\n' "$output"
            digest=$(sed -nE 's/^[^ ]+: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p' <<< "$output")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            manifests+=("$REPOSITORY@$digest")
          done
          docker buildx imagetools create --tag "$REPOSITORY:$VERSION" --tag "$REPOSITORY:latest" "${manifests[@]}"
